# Configuração da Ferramenta de Procura de Emprego.
# Pode ser editada aqui ou na página "Definições" da app (que reescreve este ficheiro).

# Áreas-alvo. Use "|" para sinónimos (ex.: "M&A|Fusões e Aquisições").
# Valores de exemplo retirados da especificação — CONFIRMAR.
areas_alvo:
  - Transaction Services
  - Valuation|Avaliação|Avaliação de empresas
  - M&A|Fusões e Aquisições|Mergers and Acquisitions

# Localizações-alvo (mesmo formato com sinónimos). CONFIRMAR.
localizacoes_alvo:
  - Lisboa|Lisbon
  - Porto|Oporto
  - Luxemburgo|Luxembourg
aceita_remoto: true

perfil:
  pasta: data/perfil
  # Versão do perfil-base validada por si. Só esta pode ser usada pelo otimizador de CV (M4).
  versao_validada: null

gmail:
  credenciais: credentials.json
  token: token.json
  etiqueta_raiz: Vagas
  etiqueta_processado: Vagas/Processado
  # Remetentes dos alertas, por fonte. Ficam vazios de propósito: os endereços exatos
  # confirmam-se a partir dos primeiros alertas recebidos (python setup_gmail.py --descobrir).
  remetentes:
    LinkedIn: []
    Indeed: []
    Net-Empregos: []
    Jobs.lu: []
    Big4: []
    Outras: []
  max_emails_por_recolha: 200

parsers:
  # Padrões (expressões regulares) adicionais para reconhecer links de vagas, por fonte.
  # A fonte "Outras" só reconhece vagas se aqui houver padrões definidos.
  padroes_link_extra:
    LinkedIn: []
    Indeed: []
    Net-Empregos: []
    Jobs.lu: []
    Big4: []
    Outras: []

compatibilidade:
  # Grelha de ponderação (proposta inicial da especificação; ajustável). Soma recomendada: 100.
  pesos:
    requisitos_obrigatorios: 35
    experiencia: 20
    competencias_tecnicas: 20
    linguas: 10
    localizacao_condicoes: 10
    alinhamento_areas: 5
  # Regra de corte: falhar um requisito eliminatório limita a pontuação a este valor.
  limite_eliminatoria: 49
  # Pontuações preliminares (só com o resumo do alerta) por regras, que é rápido.
  # Mude para true para usar também o modelo local nas preliminares.
  preliminar_com_llm: false

ollama:
  ativo: true
  host: http://localhost:11434
  # Modelo de 7–8B parâmetros. Confirmar a versão mais recente disponível no Ollama
  # e o desempenho no seu hardware (alternativas: qwen2.5:7b, llama3.1:8b).
  modelo: qwen3:8b
  temperatura: 0
  timeout_s: 300

cv:
  modelo_docx: templates/cv_modelo.docx
  # Aprove o modelo Word uma vez (página Definições). Sem aprovação não há exportação.
  modelo_aprovado: false
  pasta_saida: data/cvs
  idioma: pt
  max_pontos_por_experiencia: 5
  # Caminho do executável do LibreOffice (soffice), se não estiver no PATH.
  soffice: null

carta:
  abertura: "Exmos. Senhores,"
  fecho: "Com os melhores cumprimentos,"

tracker:
  dias_followup: 10

exportacao:
  pasta: data/exports
  separador_csv: ";"

base_dados: data/procura_emprego.db

logs:
  nao_reconhecidos: logs/emails_nao_reconhecidos.log

# Vocabulário controlado: ferramentas, métodos e certificações que o validador do CV
# procura nos pontos adaptados. Qualquer termo daqui mencionado num ponto tem de existir
# no item de origem (ou numa competência/certificação citada como origem).
vocabulario:
  ferramentas:
    - Excel
    - VBA
    - Power BI
    - Power Query
    - Power Pivot
    - Tableau
    - Qlik
    - Looker
    - SQL
    - Python
    - R
    - Stata
    - SPSS
    - MATLAB
    - Alteryx
    - SAP
    - Primavera
    - PHC
    - Oracle
    - Navision|Dynamics NAV
    - Bloomberg
    - Capital IQ
    - Refinitiv|Eikon
    - FactSet
    - Orbis
    - Mergermarket
    - PitchBook
    - PowerPoint
    - Microsoft Access|MS Access
    - Google Sheets
    - IFRS
    - SNC
    - US GAAP
    - DCF
    - LBO
    - Modelação financeira|Financial modelling|Financial modeling
    - Due diligence
    - Consolidação|Consolidation
    - FP&A
  certificacoes:
    - CFA
    - ACCA
    - CPA
    - CMA
    - FRM
    - CAIA
    - CIA
    - CISA
    - ROC|Revisor Oficial de Contas
    - OCC|Contabilista Certificado
    - PMP
    - PRINCE2
    - Six Sigma
