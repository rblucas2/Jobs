<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Procura de Emprego</title>
  <meta name="description" content="Vagas dos alertas do Gmail, compatibilidade com o perfil, CV adaptado só com dados reais e tracker de candidaturas." />
  <meta name="theme-color" content="#f6f6f4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared/base.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/jobs.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Emprego" />
</head>
<body>
  <header class="topbar">
    <div><h1 id="title">Emprego</h1><div class="sub" id="subtitle"></div></div>
    <div class="spacer"></div>
    <span class="pill" id="syncPill" title="Sincronização"></span>
    <button class="btn btn-icon btn-ghost" id="settingsBtn" aria-label="Definições">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5 2 2 0 1 1-4 0 1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1 2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9 2 2 0 1 1 2.8-2.8 1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5 2 2 0 1 1 4 0 1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3 2 2 0 1 1 2.8 2.8 1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main class="app">
    <div class="seg" id="tabs" style="margin:16px 0 4px">
      <button data-tab="vagas" class="active">Vagas</button>
      <button data-tab="vaga">Vaga</button>
      <button data-tab="cv">CV</button>
      <button data-tab="tracker">Tracker</button>
      <button data-tab="perfil">Perfil</button>
    </div>
    <div id="view"></div>
  </main>

  <script src="./shared/ui.js"></script>
  <script src="./shared/store.js"></script>
  <script src="./shared/sync.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
